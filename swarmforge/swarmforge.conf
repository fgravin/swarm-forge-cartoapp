# Format: window-invisible <role> <agent> <worktree> [task|batch] [forward-only|back-one|back-all] [extra-cli-args...]
# The optional receive mode defaults to task. Use batch for roles that should
# consume all currently queued equal-priority handoffs as one batch.
# The optional propagation token defaults to forward-only. Use back-one or
# back-all to queue merge-only copies to earlier windows.
# Any fields after those tokens are passed to the agent CLI.
# Claude runs with --permission-mode bypassPermissions unless a line names
# another mode. `auto` lets the agents work unattended while Claude Code still
# screens each action; add e.g. `--model sonnet` to a line to pick its model.
window-invisible specifier claude master --permission-mode auto
window-invisible coder claude coder --permission-mode auto
window-invisible cleaner claude cleaner batch back-one --permission-mode auto
window-invisible architect claude architect batch back-all --permission-mode auto
window-invisible hardender claude hardender batch --permission-mode auto
window-invisible QA claude QA batch back-all --permission-mode auto
